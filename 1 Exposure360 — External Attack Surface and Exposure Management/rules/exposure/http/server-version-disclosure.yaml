schema_version: 1
rule_id: exposure.http.server_version_disclosure
rule_version: 1
title: Server metadata discloses product version
description: An observed HTTP Server header contains an explicit product/version string.
category: TECHNOLOGY_DISCLOSURE
severity: LOW
activation_state: ACTIVE
applies_to:
  asset_types: [SERVICE]
  observation_types: [HTTP_RESPONSE]
confidence: {base: 0.75}
condition:
  all:
    - {field: http.headers.server, operator: contains, value: "/"}
evidence_fields: [http.headers.server]
recommendation_hint: Review externally disclosed server product/version metadata.
metadata: {tags: [externally-observable]}
