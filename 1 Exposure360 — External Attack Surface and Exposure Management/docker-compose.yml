name: exposure360-phase1
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: exposure360, POSTGRES_USER: exposure360, POSTGRES_PASSWORD: exposure360_local_only}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U exposure360 -d exposure360"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  objectstore:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin-local-only}
    volumes: [minio_data:/data]
  identity:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment: {KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: local-keycloak-admin-only}
    volumes: [./deploy/compose/keycloak-realm.json:/opt/keycloak/data/import/exposure360-realm.json:ro]
    ports: ["127.0.0.1:8081:8080"]
  otel:
    image: otel/opentelemetry-collector:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./deploy/compose/otel.yaml:/etc/otelcol/config.yaml:ro]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: deploy/compose/local.env.template
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["127.0.0.1:8000:8000"]
  worker:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    env_file: deploy/compose/local.env.template
    depends_on: {redis: {condition: service_healthy}}
  scheduler:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    env_file: deploy/compose/local.env.template
    command: ["celery", "-A", "exposure360_worker.tasks.celery", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on: {redis: {condition: service_healthy}}
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment:
      VITE_OIDC_ISSUER_URL: http://127.0.0.1:8081/realms/exposure360
      VITE_OIDC_CLIENT_ID: exposure360-web
    ports: ["127.0.0.1:8080:5173"]
volumes: {postgres_data: {}, minio_data: {}}
